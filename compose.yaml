
services:
  # База данных
  db:
    image: postgres:18-alpine
    container_name: committees_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend
  frontend:
    build:
      context: ./frontend

    ports:
      - "80:5173"

    restart: unless-stopped

volumes:
  postgres_data: